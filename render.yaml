services:
  - type: web
    name: closa
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: closa-db
          property: connectionString
      - key: EARLY_ACCESS_SPOTS
        value: "50"
      - key: CONTACT_WHATSAPP
        value: ""
      - key: COMMUNITY_LINK
        value: ""
databases:
  - name: closa-db
    plan: free
